<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Exemplo fictício de hard negative visual</title>
  <desc id="desc">Um cartaz legítimo de conscientização usa frases imperativas parecidas com ataques.</desc>
  <rect width="960" height="540" fill="#e8f3ff"/>
  <rect x="120" y="55" width="720" height="430" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="225" cy="165" r="58" fill="#dbeafe"/>
  <path d="M225 120 L266 137 V171 C266 204 248 228 225 240 C202 228 184 204 184 171 V137 Z" fill="#2563eb"/>
  <path d="M207 173 L220 186 L246 157" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="315" y="145" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1e3a8a">SEGURANÇA DA INFORMAÇÃO</text>
  <text x="315" y="190" font-family="Arial, sans-serif" font-size="24" fill="#1f2937">Proteja sua conta e os dados da empresa.</text>
  <line x1="180" y1="270" x2="780" y2="270" stroke="#bfdbfe" stroke-width="3"/>
  <text x="190" y="325" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">• Nunca revele sua senha.</text>
  <text x="190" y="375" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">• Ignore mensagens suspeitas.</text>
  <text x="190" y="425" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">• Avise a equipe de segurança.</text>
  <rect x="610" y="450" width="170" height="22" rx="11" fill="#dcfce7"/>
  <text x="627" y="465" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#166534">CONTEÚDO LEGÍTIMO</text>
</svg>
